<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0a0c10" />
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#db2777" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 44px; fill: url(#textGrad); }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #c084fc; }
    
    @keyframes pulseOrb {
      0% { opacity: 0.4; }
      50% { opacity: 0.7; }
      100% { opacity: 0.4; }
    }

    @keyframes pulseOrb2 {
      0% { opacity: 0.3; }
      50% { opacity: 0.6; }
      100% { opacity: 0.3; }
    }

    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }

    .orb1 { animation: pulseOrb 6s ease-in-out infinite; }
    .orb2 { animation: pulseOrb2 8s ease-in-out infinite; }
    .flow-line { stroke-dasharray: 10, 10; animation: dash 3s linear infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="300" fill="url(#bg)" rx="16" />
  
  <!-- Dynamic Glowing Background Elements (Behind text) -->
  <g opacity="0.6">
    <circle class="orb1" cx="200" cy="150" r="140" fill="#7c3aed" filter="url(#glow)" />
    <circle class="orb2" cx="1000" cy="150" r="160" fill="#db2777" filter="url(#glow)" />
    <circle cx="600" cy="280" r="100" fill="#2563eb" filter="url(#glow)" opacity="0.3" />
  </g>

  <!-- Grid overlay -->
  <path d="M0,50 L1200,50 M0,100 L1200,100 M0,150 L1200,150 M0,200 L1200,200 M0,250 L1200,250" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
  <path d="M200,0 L200,300 M400,0 L400,300 M600,0 L600,300 M800,0 L800,300 M1000,0 L1000,300" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />

  <!-- Animated dynamic accent lines -->
  <path class="flow-line" d="M 100 230 Q 300 270 600 230 T 1100 230" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.7" />

  <!-- Card Frame Border -->
  <rect x="2" y="2" width="1196" height="296" fill="none" stroke="url(#accent)" stroke-width="2" rx="14" opacity="0.8" />

  <!-- Foreground Content -->
  <!-- Category Pill Badge -->
  <rect x="70" y="45" width="220" height="32" rx="16" fill="#1e1b4b" stroke="#6d28d9" stroke-width="1.5" />
  <text x="180" y="66" text-anchor="middle" class="badge-text">CURATED ECOSYSTEM</text>

  <!-- Title & Subtitle -->
  <text x="70" y="130" class="title">Awesome AI Image Generation API</text>
  <text x="70" y="175" class="subtitle">Top Commercial APIs, Open-Weight Models &amp; Production Workflows (FLUX, SD, ComfyUI)</text>

  <!-- Metric / Feature Highlights -->
  <g transform="translate(70, 220)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="150" height="30" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="75" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">Commercial APIs</text>
    
    <!-- Tag 2 -->
    <rect x="165" y="0" width="150" height="30" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="240" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#a7f3d0">Open Weights</text>

    <!-- Tag 3 -->
    <rect x="330" y="0" width="160" height="30" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="410" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#fde047">Production Tools</text>
  </g>
</svg>
